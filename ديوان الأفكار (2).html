<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>ديوان الأفكار</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f15;--sf:#171a24;--sf2:#1f2330;--ink:#f1f2f6;--ink2:#9aa1b5;--bd:#2a2f40;--acc:#ff6b57;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#f4f5fa;--sf:#fff;--sf2:#eceef6;--ink:#191c28;--ink2:#667089;--bd:#dfe2ee;color-scheme:light}}
:root[data-theme=light]{--bg:#f4f5fa;--sf:#fff;--sf2:#eceef6;--ink:#191c28;--ink2:#667089;--bd:#dfe2ee;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;min-height:100vh}
button,input,select,textarea{font-family:inherit}
#lg{position:fixed;inset:0;background:#000;color:#fff;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
#lg .w{font-family:'Great Vibes','Snell Roundhand',cursive;font-size:clamp(60px,17vw,100px);line-height:1;margin:0}
#lg h1{font-size:19px;font-weight:600;letter-spacing:.14em;margin:0}
#lg input{background:none;border:0;border-bottom:1px solid #fff;color:#fff;width:190px;text-align:center;font-size:18px;padding:8px;outline:0;letter-spacing:.3em;margin-top:18px}#lg small{min-height:20px;color:#aaa}
#mn{max-width:1040px;margin:0 auto;padding:18px 16px 130px}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.hd small{color:var(--ink2)}.hd h1{margin:0;font-size:30px;font-weight:900}
.ic{background:var(--sf);border:1px solid var(--bd);color:var(--ink);width:42px;height:42px;border-radius:50%;cursor:pointer;font-size:18px}
.t{width:100%;background:var(--sf);color:var(--ink);border:1px solid var(--bd);border-radius:14px;padding:13px 15px;font-size:15px;outline:0}.t:focus{border-color:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:16px 0 8px}
.st{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:14px}.st b{display:block;font-size:30px;font-weight:900;color:var(--c)}.st span{color:var(--ink2);font-size:13px}
h3{margin:24px 0 10px;font-size:17px}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.cd{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:16px;position:relative;overflow:hidden;cursor:pointer;display:grid;gap:6px;transition:.15s}.cd:hover{transform:translateY(-3px)}
.cd:before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--c)}
.cd i{font-style:normal;font-size:24px;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 22%,transparent)}.cd b{font-size:16px}.cd small{color:var(--ink2)}.cd em{position:absolute;top:12px;inset-inline-end:12px;font-style:normal}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0}.chip{white-space:nowrap;background:var(--sf);border:1px solid var(--bd);color:var(--ink);border-radius:30px;padding:7px 16px;cursor:pointer}.chip.on{background:var(--ink);color:var(--bg)}
.ph{border-radius:24px;padding:22px;color:#fff;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 50%,#000));display:grid;gap:14px}
.ph .top{display:flex;gap:12px;align-items:center}.ph .big{font-size:40px;background:#fff3;border:0;border-radius:18px;width:68px;height:68px;cursor:pointer}.ph h1{margin:0;font-size:26px;flex:1;font-weight:900}
.ph .row select{background:#0004;color:#fff;border:0;border-radius:10px;padding:8px 12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pb{background:#fff3;color:#fff;border:0;border-radius:10px;padding:8px 14px;cursor:pointer;font-size:14px}.pb.w{background:#fff;color:#111;font-weight:700}
.dot{width:24px;height:24px;border-radius:50%;cursor:pointer;border:3px solid transparent;display:inline-block}.dot.on{border-color:var(--ink)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:16px 0 10px}.tb{white-space:nowrap;background:var(--sf);border:1px solid var(--bd);color:var(--ink);border-radius:12px;padding:9px 16px;cursor:pointer;font-size:15px}.tb.on{background:var(--c);border-color:var(--c);color:#fff;font-weight:700}.tb.ad{border-style:dashed;color:var(--ink2)}
.ed{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:14px;display:grid;gap:10px}
.ed textarea{min-height:52vh;line-height:2;resize:vertical}.ed .tt{font-size:18px;font-weight:700}
.meta{display:flex;justify-content:space-between;color:var(--ink2);font-size:13px;align-items:center}
.btn{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:12px 20px;font-size:15px;cursor:pointer;font-weight:700}.btn.alt{background:var(--sf2);color:var(--ink)}.red{color:#ff6b6b}
.ghost{background:none;border:1px solid var(--bd);color:var(--ink);border-radius:10px;padding:7px 12px;cursor:pointer}
#dk{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--sf);border:1px solid var(--bd);border-radius:30px;display:flex;gap:4px;padding:6px;box-shadow:0 10px 40px #0006;z-index:10}
#dk button{background:none;border:0;color:var(--ink2);display:grid;gap:1px;justify-items:center;padding:6px 14px;border-radius:24px;cursor:pointer;font-size:11px}#dk button span{font-size:19px}#dk button.on{background:var(--sf2);color:var(--ink)}#dk .pl{background:var(--acc);color:#fff}
.mo{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}.md{background:var(--sf);border:1px solid var(--bd);border-radius:20px;padding:20px;width:100%;max-width:440px;display:grid;gap:12px;max-height:90vh;overflow:auto}.md h3{margin:0}
.xi{display:flex;gap:10px;align-items:center;background:var(--sf2);padding:10px 12px;border-radius:12px}.xi span{flex:1}
#ts{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:30px;z-index:40;display:none}
#pa{display:none}@page{margin:0}
@media print{body>:not(#pa){display:none!important}body{background:#fff}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}#pa{display:block;color:#1b1f2e;background:#fff;font-family:Cairo,Tahoma,sans-serif}
.pt{width:100%;border-collapse:collapse}.sp{height:14mm}.pg{padding:0 16mm}
.cv{height:260mm;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 50%,#000));color:#fff;border-radius:6mm;page-break-after:always}.cv .i{font-size:70px}.cv h1{font-size:42px;margin:8px 0}.cv p{opacity:.85}
section{page-break-after:always}section:last-child{page-break-after:auto}section h2{background:var(--c);color:#fff;padding:10px 16px;border-radius:8px;margin:0}.tx{white-space:pre-wrap;line-height:2;margin-top:14px;font-size:15px}}
</style></head><body>
<div id="lg"><p class="w">Welcome</p><h1>ديوان الأفكار</h1><input id="pw" type="password" inputmode="numeric" autocomplete="off" aria-label="كلمة السر"><small id="lm"></small></div>
<main id="mn" hidden></main>
<nav id="dk" hidden><button data-v=home onclick="go('home')"><span>🏠</span>الرئيسية</button><button data-v=list onclick="go('list')"><span>🗂️</span>المشاريع</button><button class=pl onclick="ask('p')"><span>＋</span>مشروع</button><button onclick="ask('i')"><span>💡</span>فكرة</button></nav>
<div id="pa"></div><div id="ts"></div>
<script>
const V={s:"bEyvUHE16/1qG7sI/K+RRw==",i:"2rp3+vCTlcM9eOko",c:"0bIhXmV2C6O3wxHy+Xpuum8h"},IT=310000;
const $=s=>document.querySelector(s),e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),rn=a=>a[Math.floor(Math.random()*a.length)];
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),b64=a=>{let s='';for(const x of new Uint8Array(a))s+=String.fromCharCode(x);return btoa(s)};
const lg=k=>{try{return localStorage.getItem(k)}catch(_){return null}},ls=(k,v)=>{try{localStorage.setItem(k,v)}catch(_){}};
const ST=['فكرة','قيد العمل','متوقف','منجز'],CL=['#ff6b57','#ffb347','#3ddc97','#5aa9ff','#a78bfa','#f472b6'],EM=['🚀','💡','🧭','🛒','🏗️','📈','🎯','🧪','🌍','💎'];
let K,D={p:[]},view='home',pid=null,sec=null,F=-1,tmr;
async function key(pw){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(V.s),iterations:IT,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function enc(o){const iv=crypto.getRandomValues(new Uint8Array(12));return b64(iv)+'.'+b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},K,new TextEncoder().encode(JSON.stringify(o))))}
async function dec(s){const[a,b]=s.split('.');return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(a)},K,ub(b))))}
function save(now){clearTimeout(tmr);const f=async()=>ls('dz_d',await enc(D));now?f():tmr=setTimeout(f,500)}
addEventListener('pagehide',()=>K&&save(1));
function wait(){const f=JSON.parse(lg('dz_f')||'{"n":0,"t":0}');if(f.n<3)return 0;const w=Math.min(15*2**(f.n-3),3600)*1000-(Date.now()-f.t);return w>0?Math.ceil(w/1000):0}
$('#pw').addEventListener('keydown',async ev=>{if(ev.key!=='Enter')return;const w=wait();if(w)return $('#lm').textContent='انتظر '+w+' ثانية';const pw=ev.target.value;ev.target.value='';$('#lm').textContent='...';let k;
try{k=await key(pw);await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(V.i)},k,ub(V.c))}catch(_){const f=JSON.parse(lg('dz_f')||'{"n":0}');ls('dz_f',JSON.stringify({n:f.n+1,t:Date.now()}));return $('#lm').textContent='كلمة السر غير صحيحة'}
K=k;ls('dz_f','{"n":0,"t":0}');const s=lg('dz_d');if(s){try{D=await dec(s)}catch(_){$('#lm').textContent='تعذّر فتح البيانات';return}}
D.p.forEach(p=>{p.color=p.color||CL[0];p.icon=p.icon||'📁';p.st=p.st||0;p.pin=p.pin||0});$('#lg').remove();$('#mn').hidden=$('#dk').hidden=false;go('home')});
const P=()=>D.p.find(p=>p.id===pid),mn=h=>$('#mn').innerHTML=h,toast=m=>{const t=$('#ts');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)};
function go(v,id){view=v;if(id){pid=id;sec=null}document.querySelectorAll('#dk [data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));({home:H,list:L,proj:PJ})[v]();scrollTo(0,0)}
function theme(){const r=document.documentElement,d=r.dataset.theme==='dark'||(!r.dataset.theme&&!matchMedia('(prefers-color-scheme:light)').matches);r.dataset.theme=d?'light':'dark'}
const card=p=>`<div class=cd style="--c:${p.color}" onclick="go('proj','${p.id}')"><i>${p.icon}</i><b>${e(p.name)}</b><small>${ST[p.st]} · ${p.s.length} خانات</small>${p.pin?'<em>⭐</em>':''}</div>`;
function H(){const n=D.p.length,sc=D.p.reduce((a,p)=>a+p.s.length,0),pin=D.p.filter(p=>p.pin),S=[[n,'مشروع وفكرة','#5aa9ff'],[D.p.filter(p=>p.st==1).length,'قيد العمل','#ffb347'],[D.p.filter(p=>p.st==3).length,'منجز','#3ddc97'],[sc,'خانة كتابة','#a78bfa']];
mn(`<div class=hd><div><small>${new Date().toLocaleDateString('ar',{weekday:'long',day:'numeric',month:'long'})}</small><h1>مرحباً 👋</h1></div><button class=ic onclick=theme()>◐</button></div>
<input id=qi class=t placeholder="💡 سجّل فكرة سريعة ثم اضغط Enter" onkeydown="if(event.key==='Enter')qk(this)">
<div class=stats>${S.map(x=>`<div class=st style="--c:${x[2]}"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div>
${pin.length?`<h3>⭐ المثبتة</h3><div class=gr>${pin.map(card).join('')}</div>`:''}
<h3>الأحدث</h3><div class=gr>${D.p.slice(0,6).map(card).join('')||'<p style="color:var(--ink2)">ابدأ بمشروعك الأول من الزر الأحمر بالأسفل</p>'}</div>`)}
function qk(el){const v=el.value.trim();if(!v)return;mk(v.split('\n')[0].slice(0,60),'i',rn(CL),v);toast('تم حفظ الفكرة');H()}
function L(){mn(`<div class=hd><h1>المشاريع</h1></div><input id=q class=t placeholder="🔍 بحث..." oninput="fl()"><div class=chips>${['الكل',...ST].map((x,i)=>`<button class="chip ${F===i-1?'on':''}" onclick="F=${i-1};L()">${x}</button>`).join('')}</div><div class=gr id=gl></div>`);fl()}
function fl(){const q=($('#q')?.value||'').trim().toLowerCase();$('#gl').innerHTML=D.p.filter(p=>(F<0||p.st===F)&&p.name.toLowerCase().includes(q)).map(card).join('')||'<p style="color:var(--ink2)">لا يوجد شيء هنا</p>'}
function md(h){const m=document.createElement('div');m.className='mo';m.innerHTML=`<div class=md>${h}</div>`;m.onclick=ev=>{if(ev.target===m)m.remove()};document.body.append(m);return m}
function mk(n,t,c,tx){const p={id:uid(),name:n,type:t,color:c,icon:rn(EM),st:0,pin:0,s:t==='i'?[{id:uid(),name:'الفكرة',text:tx}]:[]};D.p.unshift(p);save(1);return p}
function ask(t){let c=rn(CL);const m=md(`<h3>${t==='p'?'🚀 مشروع جديد':'💡 فكرة جديدة'}</h3><input class=t id=nn placeholder="الاسم">${t==='i'?'<textarea class=t id=nc rows=6 placeholder="اكتب الفكرة..."></textarea>':''}<div class=row id=cs>${CL.map(x=>`<span class="dot${x===c?' on':''}" data-c="${x}" style="background:${x}"></span>`).join('')}</div><div class=row><button class=btn id=ok>إنشاء</button><button class="btn alt" onclick="this.closest('.mo').remove()">إلغاء</button></div>`);
m.querySelector('#nn').focus();m.querySelector('#cs').onclick=ev=>{const x=ev.target.dataset.c;if(!x)return;c=x;m.querySelectorAll('.dot').forEach(d=>d.classList.toggle('on',d.dataset.c===x))};
m.querySelector('#ok').onclick=()=>{const n=m.querySelector('#nn').value.trim();if(!n)return;const p=mk(n,t,c,t==='i'?m.querySelector('#nc').value:'');m.remove();go('proj',p.id)}}
function PJ(){const p=P();if(!p)return go('list');const s=p.s.find(x=>x.id===sec);
mn(`<div class=ph style="--c:${p.color}"><div class=top><button class=big onclick="P().icon=rn(EM);save();PJ()">${p.icon}</button><h1>${e(p.name)}</h1><button class=pb onclick="go('list')">→</button></div>
<div class=row><select onchange="P().st=+this.value;save()">${ST.map((x,i)=>`<option value=${i} ${p.st===i?'selected':''}>${x}</option>`).join('')}</select><button class=pb onclick="P().pin=P().pin?0:1;save();PJ()">${p.pin?'⭐ مثبّت':'☆ تثبيت'}</button><button class=pb onclick="rnm()">✎ تسمية</button><button class=pb onclick="delP()">🗑</button>${CL.map(x=>`<span class="dot${x===p.color?' on':''}" style="background:${x}" onclick="P().color='${x}';save();PJ()"></span>`).join('')}</div>
<div class=row><button class="pb w" onclick="xp()">📄 تحميل PDF</button></div></div>
<div class=tabs style="--c:${p.color}">${p.s.map(x=>`<button class="tb ${x.id===sec?'on':''}" onclick="sec='${x.id}';PJ()">${e(x.name)}</button>`).join('')}<button class="tb ad" onclick="addS()">＋ خانة</button></div>
${s?`<div class=ed><input class="t tt" value="${e(s.name)}" oninput="ups('name',this.value)"><textarea class=t placeholder="اكتب هنا بحرية..." oninput="ups('text',this.value)">${e(s.text)}</textarea><div class=meta><span id=wc>${wc(s.text)}</span><button class="ghost red" onclick="delS()">حذف الخانة</button></div></div>`:`<p style="color:var(--ink2)">${p.s.length?'اختر خانة للكتابة':'أضف أول خانة (مثال: ماركتينج، مبيعات...)'}</p>`}`)}
const wc=t=>(t.trim()?t.trim().split(/\s+/).length:0)+' كلمة';
function ups(k,v){const s=P().s.find(x=>x.id===sec);s[k]=v;save();if(k==='text')$('#wc').textContent=wc(v)}
function addS(){const n=prompt('اسم الخانة');if(!n||!n.trim())return;const x={id:uid(),name:n.trim(),text:''};P().s.push(x);sec=x.id;save(1);PJ()}
function rnm(){const n=prompt('اسم جديد',P().name);if(n&&n.trim()){P().name=n.trim();save(1);PJ()}}
function delS(){if(!confirm('حذف هذه الخانة نهائياً؟'))return;const p=P();p.s=p.s.filter(x=>x.id!==sec);sec=null;save(1);PJ()}
function delP(){if(!confirm('حذف المشروع بكل خاناته نهائياً؟'))return;D.p=D.p.filter(x=>x.id!==pid);save(1);go('list')}
function xp(){const p=P();if(!p.s.length)return toast('لا توجد خانات');const m=md(`<h3>📄 تحميل PDF</h3>${p.s.map(x=>`<label class=xi><input type=checkbox checked value="${x.id}"><span>${e(x.name)}</span><button class=ghost onclick="event.preventDefault();pdf(['${x.id}'])">PDF</button></label>`).join('')}<button class=btn id=xa>تحميل الحزمة الكاملة لهذا المشروع</button><button class="btn alt" id=xs>تحميل الخانات المحددة فقط</button><small style="color:var(--ink2)">في نافذة الطباعة اختر «حفظ بصيغة PDF» وأوقف خيار «الرؤوس والتذييلات» إن ظهر.</small>`);
m.querySelector('#xa').onclick=()=>pdf();m.querySelector('#xs').onclick=()=>pdf([...m.querySelectorAll('input:checked')].map(i=>i.value))}
function pdf(ids){const p=P(),ss=p.s.filter(x=>!ids||ids.includes(x.id));if(!ss.length)return toast('اختر خانة أولاً');const sp='<div class=sp></div>';
$('#pa').innerHTML=`<table class=pt style="--c:${p.color}"><thead><tr><td>${sp}</td></tr></thead><tfoot><tr><td>${sp}</td></tr></tfoot><tbody><tr><td class=pg>${ss.length>1?`<div class=cv><div class=i>${p.icon}</div><h1>${e(p.name)}</h1><p>${ss.length} وثائق · ${new Date().toLocaleDateString('ar')}</p></div>`:''}${ss.map(x=>`<section><h2>${e(x.name)}</h2><div class=tx>${e(x.text)}</div></section>`).join('')}</td></tr></tbody></table>`;
const t=document.title;document.title=' ';try{print()}catch(_){toast('الطباعة غير متاحة هنا')}document.title=t}
</script></body></html>
